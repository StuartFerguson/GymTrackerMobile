name: Android UI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  primary-journeys:
    name: Primary journeys
    if: ${{ vars.ANDROID_UI_TESTS == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore MAUI workloads
        run: dotnet workload restore GymTrackerMobile.sln

      - name: Restore dependencies
        run: dotnet restore GymTrackerMobile.sln

      - name: Build debug Android APK
        run: dotnet build src/GymTrackerMobile/GymTrackerMobile.csproj --configuration Debug --framework net10.0-android --no-restore

      - name: Install Appium
        run: |
          npm install --global appium@3
          appium driver install uiautomator2

      - name: Run Android UI journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            mkdir -p test-results
            APK_PATH="$(find src/GymTrackerMobile/bin/Debug/net10.0-android -maxdepth 1 -name '*.apk' | head -n 1)"
            appium --base-path /wd/hub > test-results/appium.log 2>&1 &
            APPIUM_PID=$!
            trap 'kill "$APPIUM_PID" || true' EXIT
            sleep 5
            APPIUM_SERVER_URL=http://127.0.0.1:4723/wd/hub \
            ANDROID_DEVICE_NAME=GymTrackerApi35 \
            GYMTRACKER_APK_PATH="$GITHUB_WORKSPACE/$APK_PATH" \
            dotnet test tests/GymTrackerMobile.UI.AutomationTests/GymTrackerMobile.UI.AutomationTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=android-ui.trx" --results-directory test-results

      - name: Upload Android UI artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-results
          path: test-results
          if-no-files-found: ignore
